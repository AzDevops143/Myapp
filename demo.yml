name: demo

on:
  push: 
    branches:
      - main
      - master
  
  pull_request:
    branches:
      - main
      - master

jobs:
  bert-huggingface-wandb-demo:
    runs-on: ubuntu-latest

    env:
      WANDB_PROJECT: wandb demo
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: "DuckyDuck123/hindi-en-demo-model"
      UPLOAD_TO_HF: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
    
      - name: Building the docker image
        run: docker build -t bert-huggingface-wandb-demo .

      - name: Run Inference
        run: |
          docker run --rm \
            -e WANDB_API_KEY="${WANDB_API_KEY}" \
            -e WANDB_PROJECT="${WANDB_PROJECT}" \
            -e HF_TOKEN="${HF_TOKEN}" \
            -e HF_REPO_ID="${HF_REPO_ID}" \
            -e UPLOAD_TO_HF="${UPLOAD_TO_HF}" \
            bert-huggingface-wandb-demo





